# Light theme matching the original Recipe A explorer look (user feedback
# 2026-07-03: white background, dark text, red accent).
[theme]
base = "light"
primaryColor = "#ff4b4b"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#31333f"
font = "sans serif"

[server]
headless = true
# Serve incident clips as static files so the video component stays a small
# ForwardMsg (inline base64 blew past the 10 KB cache threshold and the
# 0.5 s fragment ticks aged the cached message out -> "Cached ForwardMsg
# MISS" connection errors).
enableStaticServing = true

[global]
# Belt-and-braces for the same bug: fragment reruns churn the run counter
# that ages cached ForwardMsgs (default maxCachedMessageAge = 2), evicting
# messages the client still references.
maxCachedMessageAge = 300
