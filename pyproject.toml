[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recipe-a-pipeline"
version = "0.1.0"
description = "Recipe A — multimodal CNC failure-explanation dataset pipeline (sensor + video + text -> incidents.parquet)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "typer>=0.9",
    "streamlit>=1.54",
]

[project.optional-dependencies]
text = ["tiktoken>=0.5", "pypdf>=4.0", "python-docx>=1.1"]
retrieval = ["rank-bm25>=0.2"]
eval = ["matplotlib>=3.7"]
encoder = ["torch>=2.2"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
recipe-a = "src.cli:app"

[tool.setuptools]
packages = [
    "contracts",
    "src",
    "src.common",
    "src.encoder",
    "src.etl",
    "src.eval",
    "src.features",
    "src.tgfx",
    "src.ui",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "ffmpeg: tests that require a real ffmpeg/ffprobe binary on PATH",
    "browser: browser-level UI smoke tests; opt in with RUN_BROWSER_SMOKE=1",
]

[tool.ruff]
line-length = 100
target-version = "py310"
