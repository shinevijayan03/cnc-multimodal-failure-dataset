name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (advisory)
        run: |
          pip install ruff
          ruff check src tests
        continue-on-error: true

      - name: Run tests
        run: pytest -q --cov=src --cov-report=term-missing

      # The video end-to-end path needs ffmpeg; the suite skips it when absent,
      # so the line below is intentionally not required for the unit/integration
      # suite. Uncomment to also exercise the real-ffmpeg video test:
      # - name: Install ffmpeg
      #   run: sudo apt-get update && sudo apt-get install -y ffmpeg
